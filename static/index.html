<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book an Appointment</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 480px;
    margin: 3rem auto;
    padding: 0 1rem;
    color: #1a1a1a;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.hint { color: #666; font-size: 0.85rem; margin-top: 0; margin-bottom: 1.5rem; }
  label { display: block; font-weight: 600; font-size: 0.85rem; margin: 1rem 0 0.25rem; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 0.5rem;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  button {
    margin-top: 1.5rem;
    width: 100%;
    padding: 0.7rem;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: #1a1a1a;
    color: white;
    cursor: pointer;
  }
  button:disabled { background: #999; cursor: default; }
  #result { margin-top: 1.5rem; }
  .box { padding: 0.9rem 1rem; border-radius: 8px; margin-top: 0.75rem; font-size: 0.9rem; line-height: 1.4; }
  .box.notice { background: #fff8e6; border: 1px solid #f0d98c; }
  .box.success { background: #e8f7ee; border: 1px solid #a3ddb8; }
  .box.failure { background: #fdeaea; border: 1px solid #eeb3b3; }

  .voice-card {
    padding: 1rem 1.1rem;
    border: 1px solid #ddd;
    border-radius: 10px;
    margin-bottom: 1.5rem;
    background: #fafafa;
  }
  .voice-card h2 { font-size: 1rem; margin: 0 0 0.5rem; }
  #mic-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    padding: 0.7rem;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: #1a1a1a;
    color: white;
    cursor: pointer;
  }
  #mic-btn.listening { background: #c0392b; }
  #mic-btn:disabled { background: #999; cursor: default; }
  #voice-transcript {
    margin-top: 0.6rem;
    font-size: 0.9rem;
    color: #444;
    min-height: 1.2em;
    font-style: italic;
  }
  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: #999;
    font-size: 0.8rem;
    margin: 1.5rem 0;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    border-bottom: 1px solid #ddd;
  }
  .divider:not(:empty)::before { margin-right: 0.75em; }
  .divider:not(:empty)::after { margin-left: 0.75em; }

  .auth-card {
    padding: 1.2rem;
    border: 1px solid #ddd;
    border-radius: 10px;
    margin-top: 1.5rem;
  }
  .auth-card h2 { font-size: 1.1rem; margin: 0 0 0.25rem; }
  .auth-buttons { display: flex; gap: 0.6rem; }
  .auth-buttons button { margin-top: 1rem; }
  .auth-buttons button.secondary { background: white; color: #1a1a1a; border: 1px solid #ccc; }
  #auth-error { color: #c0392b; font-size: 0.85rem; margin-top: 0.6rem; }
  #auth-note { color: #666; font-size: 0.85rem; margin-top: 0.6rem; }

  .user-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: #444;
    margin-bottom: 1rem;
  }
  .user-bar-actions {
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }
  .user-bar-actions a { color: #1a1a1a; }
  .user-bar button {
    margin-top: 0;
    width: auto;
    padding: 0.35rem 0.8rem;
    font-size: 0.8rem;
    background: white;
    color: #1a1a1a;
    border: 1px solid #ccc;
  }
</style>
</head>
<body>

<h1>Book an Appointment</h1>
<p class="hint">
  Tip: booking the same date and time twice triggers the self-correction
  demo -- the second request will find and book an alternative
  automatically.
</p>

<div id="auth-card" class="auth-card" hidden>
  <h2>Sign in</h2>
  <label for="auth-email">Email</label>
  <input id="auth-email" type="email" required>
  <label for="auth-password">Password</label>
  <input id="auth-password" type="password" required minlength="6">
  <div class="auth-buttons">
    <button type="button" id="signin-btn">Sign In</button>
    <button type="button" id="signup-btn" class="secondary">Sign Up</button>
  </div>
  <div id="auth-error"></div>
  <div id="auth-note"></div>
</div>

<div id="app" hidden>
<div class="user-bar">
  <span id="user-email"></span>
  <span class="user-bar-actions">
    <a href="/bookings">My Bookings</a>
    <button type="button" id="signout-btn">Sign out</button>
  </span>
</div>

<div class="voice-card">
  <h2>🎤 Speak your request</h2>
  <button type="button" id="mic-btn">Start speaking</button>
  <div id="voice-transcript"></div>
</div>

<div class="divider">or fill out the form</div>

<form id="booking-form">
  <label for="title">What's this for?</label>
  <input id="title" name="title" type="text" placeholder="Dentist appointment" required>

  <label for="date">Date</label>
  <input id="date" name="date" type="date" required>

  <label for="time">Time</label>
  <input id="time" name="time" type="time" required>

  <label for="duration">Duration (minutes)</label>
  <input id="duration" name="duration" type="number" value="30" min="15" step="15" required>

  <label for="constraints">Any constraints? (optional)</label>
  <input id="constraints" name="constraints" type="text" placeholder="e.g. must stay in the afternoon">

  <button type="submit" id="submit-btn">Book Appointment</button>
</form>

<div id="result"></div>
</div><!-- #app -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ---- auth: Supabase session gating -----------------------------------
//
// /api/config tells us whether the backend is running with the Supabase
// calendar (auth required) or the mock one (auth skipped entirely) --
// see server.py's AUTH_REQUIRED. This keeps local/CLI dev working with
// zero Supabase setup while the real deployment requires sign-in.

let supabaseClient = null;
let authEnabled = false;

async function getAuthHeaders() {
  if (!authEnabled || !supabaseClient) return {};
  const { data } = await supabaseClient.auth.getSession();
  const token = data.session ? data.session.access_token : null;
  return token ? { Authorization: `Bearer ${token}` } : {};
}

function showApp(session) {
  document.getElementById("auth-card").hidden = true;
  document.getElementById("app").hidden = false;
  document.getElementById("user-email").textContent = session ? session.user.email : "";
}

function showAuth() {
  document.getElementById("auth-card").hidden = false;
  document.getElementById("app").hidden = true;
}

async function initAuth() {
  const config = await (await fetch("/api/config")).json();
  authEnabled = config.auth_enabled;

  if (!authEnabled) {
    showApp(null);
    return;
  }

  supabaseClient = window.supabase.createClient(config.supabase_url, config.supabase_anon_key);

  const { data: { session } } = await supabaseClient.auth.getSession();
  session ? showApp(session) : showAuth();

  supabaseClient.auth.onAuthStateChange((_event, session) => {
    session ? showApp(session) : showAuth();
  });

  const emailEl = document.getElementById("auth-email");
  const passwordEl = document.getElementById("auth-password");
  const errorEl = document.getElementById("auth-error");
  const noteEl = document.getElementById("auth-note");

  document.getElementById("signin-btn").addEventListener("click", async () => {
    errorEl.textContent = "";
    noteEl.textContent = "";
    const { error } = await supabaseClient.auth.signInWithPassword({
      email: emailEl.value,
      password: passwordEl.value,
    });
    if (error) errorEl.textContent = error.message;
  });

  document.getElementById("signup-btn").addEventListener("click", async () => {
    errorEl.textContent = "";
    noteEl.textContent = "";
    const { data, error } = await supabaseClient.auth.signUp({
      email: emailEl.value,
      password: passwordEl.value,
    });
    if (error) {
      errorEl.textContent = error.message;
    } else if (!data.session) {
      noteEl.textContent = "Check your email to confirm your account, then sign in.";
    }
  });

  document.getElementById("signout-btn").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
  });
}

initAuth();

const form = document.getElementById("booking-form");
const resultEl = document.getElementById("result");
const submitBtn = document.getElementById("submit-btn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = "Booking...";
  resultEl.innerHTML = "";

  const payload = {
    title: document.getElementById("title").value,
    date: document.getElementById("date").value,
    time: document.getElementById("time").value,
    duration_minutes: parseInt(document.getElementById("duration").value, 10),
    constraints: document.getElementById("constraints").value,
  };

  try {
    const res = await fetch("/api/book", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...(await getAuthHeaders()) },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    render(data);
  } catch (err) {
    resultEl.innerHTML = `<div class="box failure">Something went wrong talking to the server: ${String(err)}</div>`;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Book Appointment";
  }
});

function render(data, { speakAloud = false } = {}) {
  let html = "";

  // If it took more than one attempt, the requested time changed --
  // narrate that before showing the final outcome, same as the CLI's
  // real-time [assistant] lines.
  if (data.corrected) {
    for (const msg of data.messages.slice(0, -1)) {
      html += `<div class="box notice">${escapeHtml(msg)}</div>`;
    }
  }

  if (data.status === "booked") {
    html += `<div class="box success"><strong>Booked!</strong> ${escapeHtml(data.title)} on ${data.date} at ${data.time}.</div>`;
  } else {
    const lastMsg = data.messages[data.messages.length - 1] || "Couldn't find a slot that works.";
    html += `<div class="box failure">${escapeHtml(lastMsg)}</div>`;
  }

  resultEl.innerHTML = html;

  // Same messages the boxes above render, spoken back in order -- this
  // is BookingFlow's `notify` seam surfaced as TTS instead of text.
  if (speakAloud && data.messages && data.messages.length) {
    speakSequence(data.messages);
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ---- voice: speech-to-text (capture) --------------------------------
//
// Records raw audio and uploads it for server-side transcription (Whisper,
// see server.py) rather than using the browser's built-in
// SpeechRecognition -- that API depends on Google's speech service being
// reachable and fails hard (a bare "network" error) when it isn't.

const micBtn = document.getElementById("mic-btn");
const transcriptEl = document.getElementById("voice-transcript");

const canRecord = navigator.mediaDevices && window.MediaRecorder;

if (!canRecord) {
  micBtn.disabled = true;
  micBtn.textContent = "Voice not supported in this browser";
  transcriptEl.textContent = "Microphone recording isn't available here -- use the form below.";
} else {
  let mediaRecorder = null;
  let chunks = [];
  let recording = false;

  micBtn.addEventListener("click", async () => {
    if (recording) {
      mediaRecorder.stop();
      return;
    }

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      transcriptEl.textContent = `Mic error: ${err.message || err}`;
      return;
    }

    window.speechSynthesis.cancel();
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);

    mediaRecorder.addEventListener("dataavailable", (e) => {
      if (e.data.size > 0) chunks.push(e.data);
    });

    mediaRecorder.addEventListener("start", () => {
      recording = true;
      micBtn.classList.add("listening");
      micBtn.textContent = "Stop speaking";
      transcriptEl.textContent = "Recording...";
      resultEl.innerHTML = "";
    });

    mediaRecorder.addEventListener("stop", async () => {
      recording = false;
      micBtn.classList.remove("listening");
      micBtn.textContent = "Start speaking";
      stream.getTracks().forEach((track) => track.stop());

      const blob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
      transcriptEl.textContent = "Transcribing...";
      micBtn.disabled = true;

      try {
        const formData = new FormData();
        formData.append("audio", blob, "speech.webm");
        const res = await fetch("/api/book-voice", {
          method: "POST",
          headers: await getAuthHeaders(),
          body: formData,
        });
        const data = await res.json();
        transcriptEl.textContent = data.heard ? `Heard: "${data.heard}"` : "";
        render(data, { speakAloud: true });
      } catch (err) {
        resultEl.innerHTML = `<div class="box failure">Something went wrong talking to the server: ${String(err)}</div>`;
      } finally {
        micBtn.disabled = false;
      }
    });

    mediaRecorder.start();
  });
}

// ---- voice: text-to-speech (playback) --------------------------------

function speakSequence(messages) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  for (const msg of messages) {
    const utterance = new SpeechSynthesisUtterance(msg);
    window.speechSynthesis.speak(utterance);
  }
}
</script>

</body>
</html>
