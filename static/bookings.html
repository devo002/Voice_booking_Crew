<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Bookings</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 480px;
    margin: 3rem auto;
    padding: 0 1rem;
    color: #1a1a1a;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.hint { color: #666; font-size: 0.85rem; margin-top: 0; margin-bottom: 1.5rem; }
  p.hint a { color: #1a1a1a; }

  .user-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: #444;
    margin-bottom: 1.5rem;
  }
  .user-bar button {
    padding: 0.35rem 0.8rem;
    font-size: 0.8rem;
    font-weight: 600;
    border-radius: 6px;
    background: white;
    color: #1a1a1a;
    border: 1px solid #ccc;
    cursor: pointer;
  }

  .booking-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.8rem 1rem;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-top: 0.6rem;
  }
  .booking-row .info { font-size: 0.9rem; line-height: 1.4; }
  .booking-row .info strong { display: block; }
  .booking-row .info .when { color: #666; }
  .booking-row button {
    padding: 0.35rem 0.7rem;
    font-size: 0.8rem;
    font-weight: 600;
    border-radius: 6px;
    background: #fdeaea;
    color: #c0392b;
    border: 1px solid #eeb3b3;
    cursor: pointer;
    white-space: nowrap;
  }
  .booking-row button:disabled { opacity: 0.6; cursor: default; }
  .booking-row.highlight { background: #fff8e6; border-color: #f0d98c; }

  #empty-state { color: #666; font-size: 0.9rem; margin-top: 1rem; }

  .calendar-card {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 1.5rem;
  }
  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
  }
  .calendar-header h2 { font-size: 1rem; margin: 0; }
  .calendar-header button {
    padding: 0.25rem 0.65rem;
    font-size: 1rem;
    line-height: 1;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: white;
    cursor: pointer;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .calendar-weekday {
    text-align: center;
    font-size: 0.68rem;
    color: #999;
    font-weight: 600;
    padding: 0.2rem 0;
  }
  .calendar-day {
    min-height: 3.4rem;
    border: 1px solid #eee;
    border-radius: 6px;
    padding: 0.2rem;
    font-size: 0.7rem;
    overflow: hidden;
  }
  .calendar-day.empty { border-color: transparent; }
  .calendar-day.today .day-num {
    display: inline-block;
    background: #1a1a1a;
    color: white;
    border-radius: 50%;
    width: 1.2rem;
    height: 1.2rem;
    text-align: center;
    line-height: 1.2rem;
  }
  .calendar-day.has-bookings { cursor: pointer; background: #fff8e6; border-color: #f0d98c; }
  .calendar-day .day-num { font-weight: 600; }
  .calendar-day .chip {
    font-size: 0.6rem;
    background: #1a1a1a;
    color: white;
    border-radius: 3px;
    padding: 1px 3px;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="user-bar">
  <span id="user-email"></span>
  <button type="button" id="signout-btn" hidden>Sign out</button>
</div>

<h1>My Bookings</h1>
<p class="hint"><a href="/">&larr; Back to book an appointment</a></p>

<div class="calendar-card">
  <div class="calendar-header">
    <button type="button" id="cal-prev" aria-label="Previous month">&lsaquo;</button>
    <h2 id="cal-month-label"></h2>
    <button type="button" id="cal-next" aria-label="Next month">&rsaquo;</button>
  </div>
  <div class="calendar-grid" id="calendar-grid"></div>
</div>

<div id="bookings-list"></div>
<div id="empty-state" hidden>No bookings yet.</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
let supabaseClient = null;

async function getAuthHeaders() {
  if (!supabaseClient) return {};
  const { data } = await supabaseClient.auth.getSession();
  const token = data.session ? data.session.access_token : null;
  return token ? { Authorization: `Bearer ${token}` } : {};
}

async function init() {
  const config = await (await fetch("/api/config")).json();

  if (!config.auth_enabled) {
    // Mock backend -- no user accounts, bookings aren't scoped to anyone.
    await loadBookings();
    return;
  }

  supabaseClient = window.supabase.createClient(config.supabase_url, config.supabase_anon_key);
  const { data: { session } } = await supabaseClient.auth.getSession();

  if (!session) {
    window.location.href = "/";
    return;
  }

  document.getElementById("user-email").textContent = session.user.email;
  const signoutBtn = document.getElementById("signout-btn");
  signoutBtn.hidden = false;
  signoutBtn.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "/";
  });

  await loadBookings();
}

let allBookings = [];
let calendarMonth = new Date();
calendarMonth.setDate(1);

const WEEKDAY_LABELS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function renderCalendar() {
  const gridEl = document.getElementById("calendar-grid");
  const labelEl = document.getElementById("cal-month-label");
  labelEl.textContent = calendarMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" });

  const byDate = {};
  for (const b of allBookings) {
    (byDate[b.date] = byDate[b.date] || []).push(b);
  }

  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);

  let html = WEEKDAY_LABELS.map((d) => `<div class="calendar-weekday">${d}</div>`).join("");

  for (let i = 0; i < firstWeekday; i++) {
    html += `<div class="calendar-day empty"></div>`;
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const dayBookings = byDate[dateStr] || [];
    const classes = ["calendar-day"];
    if (dateStr === todayStr) classes.push("today");
    if (dayBookings.length) classes.push("has-bookings");

    const chips = dayBookings
      .slice(0, 2)
      .map((b) => `<div class="chip">${escapeHtml(b.time)} ${escapeHtml(b.title)}</div>`)
      .join("");
    const more =
      dayBookings.length > 2 ? `<div class="chip">+${dayBookings.length - 2} more</div>` : "";

    html += `<div class="${classes.join(" ")}" data-date="${dateStr}">
      <div class="day-num">${day}</div>
      ${chips}${more}
    </div>`;
  }

  gridEl.innerHTML = html;

  gridEl.querySelectorAll(".calendar-day.has-bookings").forEach((cell) => {
    cell.addEventListener("click", () => {
      const row = document.querySelector(`.booking-row[data-date="${cell.dataset.date}"]`);
      if (!row) return;
      row.scrollIntoView({ behavior: "smooth", block: "center" });
      row.classList.add("highlight");
      setTimeout(() => row.classList.remove("highlight"), 1500);
    });
  });
}

document.getElementById("cal-prev").addEventListener("click", () => {
  calendarMonth.setMonth(calendarMonth.getMonth() - 1);
  renderCalendar();
});
document.getElementById("cal-next").addEventListener("click", () => {
  calendarMonth.setMonth(calendarMonth.getMonth() + 1);
  renderCalendar();
});

async function loadBookings() {
  const listEl = document.getElementById("bookings-list");
  const emptyEl = document.getElementById("empty-state");

  const res = await fetch("/api/bookings", { headers: await getAuthHeaders() });
  const data = await res.json();
  const bookings = data.bookings || [];
  allBookings = bookings;
  renderCalendar();

  if (bookings.length === 0) {
    listEl.innerHTML = "";
    emptyEl.hidden = false;
    return;
  }
  emptyEl.hidden = true;

  listEl.innerHTML = bookings
    .map(
      (b) => `
    <div class="booking-row" data-date="${escapeHtml(b.date)}" data-time="${escapeHtml(b.time)}">
      <div class="info">
        <strong>${escapeHtml(b.title)}</strong>
        <span class="when">${escapeHtml(b.date)} at ${escapeHtml(b.time)} (${b.duration_minutes} min)</span>
      </div>
      <button type="button" class="cancel-btn">Cancel</button>
    </div>
  `
    )
    .join("");

  listEl.querySelectorAll(".cancel-btn").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      const row = e.target.closest(".booking-row");
      const { date, time } = row.dataset;
      btn.disabled = true;
      btn.textContent = "Cancelling...";
      await fetch(`/api/bookings?date=${encodeURIComponent(date)}&time=${encodeURIComponent(time)}`, {
        method: "DELETE",
        headers: await getAuthHeaders(),
      });
      await loadBookings();
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

init();
</script>

</body>
</html>
